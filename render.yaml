services:
  - type: web
    name: landslide-ner-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: IS_DEMO_MODE
        value: "true"
      - key: HOST
        value: 0.0.0.0
