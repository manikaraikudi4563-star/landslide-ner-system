[project]
name = "landslide-ner-system"
version = "2.6.0"
description = "AI-Based Landslide Risk Monitoring and Early Warning System for NER India"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "main.py"